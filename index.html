<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>External MCR Grid Monitor</title>
  <style>
    :root {
      --bg-main: #07090e;
      --card-bg: rgba(18, 22, 33, 0.85);
      --card-border: #1e2638;
      --accent-red: #ff2a55;
      --accent-cyan: #00e5ff;
      --accent-yellow: #ffcc00;
      --text-main: #f0f4f8;
      --text-muted: #62728d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 42, 85, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 50% 100%, rgba(0, 229, 255, 0.05) 0%, transparent 50%);
      overflow: hidden; /* ABSOLUTELY NO SCROLLBARS */
      color: var(--text-main);
      display: flex;
      flex-direction: column;
    }

    /* Header Bar */
    .header-bar {
      width: 100%;
      height: 42px;
      padding: 0 16px;
      background: rgba(15, 18, 28, 0.9);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      flex-shrink: 0;
      backdrop-filter: blur(10px);
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--text-main);
      text-transform: uppercase;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-red);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-red);
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Fullscreen No-Scroll Container */
    .website-container {
      width: 100%;
      flex: 1;
      padding: 8px;
      box-sizing: border-box;
      display: flex;
      overflow: hidden;
    }

    .content-split {
      display: flex;
      gap: 10px;
      width: 100%;
      height: 100%;
    }

    /* 32 BOXES MATRIX (8 ROWS x 4 COLS) */
    .grid-container {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: 6px;
      height: 100%;
    }

    /* BROADCAST BOXES */
    .green-box {
      position: relative;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-top: 2px solid var(--accent-cyan);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 4px 2px 4px;
      text-align: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
      overflow: hidden;
    }

    .box-number {
      position: absolute;
      top: 2px;
      right: 6px;
      color: var(--accent-cyan);
      font-size: 9px;
      font-weight: 800;
      opacity: 0.85;
      letter-spacing: 0.5px;
    }

    .box-city {
      color: var(--text-main);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 95%;
    }

    .box-liveu {
      color: var(--accent-cyan);
      font-size: 10px;
      font-weight: 700;
      margin-top: 1px;
      letter-spacing: 0.5px;
    }

    /* ALARM ANIMATION */
    @keyframes broadcastAlarm {
      0% {
        background-color: rgba(255, 42, 85, 0.85);
        border-color: #ff2a55;
        box-shadow: 0 0 15px rgba(255, 42, 85, 0.8);
      }
      50% {
        background-color: rgba(255, 42, 85, 0.25);
        border-color: #ff7591;
        box-shadow: 0 0 4px rgba(255, 42, 85, 0.3);
      }
      100% {
        background-color: rgba(255, 42, 85, 0.85);
        border-color: #ff2a55;
        box-shadow: 0 0 15px rgba(255, 42, 85, 0.8);
      }
    }

    .green-box.alarm-active {
      animation: broadcastAlarm 0.7s infinite alternate;
      z-index: 10;
      border-top-color: #ffffff;
    }

    /* CONTROLS MATRIX (32 ROW ITEMS) */
    .input-panel {
      width: 160px;
      display: grid;
      grid-template-rows: repeat(32, 1fr);
      gap: 3px;
      height: 100%;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(18, 22, 33, 0.6);
      padding: 1px 4px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      overflow: hidden;
    }

    .selects-group {
      display: flex;
      gap: 3px;
      width: 100%;
      height: 100%;
      align-items: center;
    }

    .yellow-select, .cyan-select {
      background: #0f131d;
      padding: 0 2px;
      font-size: 9px;
      font-weight: 700;
      border-radius: 3px;
      outline: none;
      width: 100%;
      height: 90%;
      text-align: center;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }

    .yellow-select {
      border: 1px solid rgba(255, 204, 0, 0.4);
      color: var(--accent-yellow);
    }

    .cyan-select {
      border: 1px solid rgba(0, 229, 255, 0.4);
      color: var(--accent-cyan);
      display: none;
    }

    .yellow-select:focus {
      border-color: var(--accent-yellow);
    }

    .cyan-select:focus {
      border-color: var(--accent-cyan);
    }

    .input-idx {
      color: var(--accent-cyan);
      font-size: 9px;
      font-weight: 800;
      min-width: 14px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Top Header Bar -->
  <div class="header-bar">
    <div class="brand-title">
      <span class="live-dot"></span>
      <span>EXTERNAL MCR GRID MONITOR</span>
    </div>
  </div>

  <div class="website-container">
    <div class="content-split">
      <!-- 32 Boxes Dynamic Matrix -->
      <div class="grid-container" id="grid-main"></div>

      <!-- 32 Controls Dynamic Matrix -->
      <div class="input-panel" id="controls-main"></div>
    </div>
  </div>

  <script>
    const TOTAL_CHANNELS = 32;

    const kurdistanCities = [
      "-- شار --", "هەولێر", "سلێمانی", "دهۆک", "هەڵەبجە", "ڕانیە", 
      "قەڵادزێ", "کۆیە", "چەمچەماڵ", "کەرکووک", "زاخۆ", "ئاکرێ", "سۆران", 
      "کەلار", "کفری", "پێنجوێن", "دەربەندیخان", "شەقڵاوە", "شێخان", "ئامێدی", "بەردەڕەش"
    ];

    const liveUOptions = [
      "-- LiveU --", "LiveU 1", "LiveU 2", "LiveU 3", "LiveU 4", "LiveU 5", "LiveU 6"
    ];

    const alarmTimers = {};
    const gridMain = document.getElementById('grid-main');
    const controlsMain = document.getElementById('controls-main');

    function triggerAlarm(boxContainer) {
      if (!boxContainer) return;
      const boxId = boxContainer.id;
      boxContainer.classList.add('alarm-active');
      if (alarmTimers[boxId]) clearTimeout(alarmTimers[boxId]);
      alarmTimers[boxId] = setTimeout(() => {
        boxContainer.classList.remove('alarm-active');
      }, 5000);
    }

    // Generate 32 Items into standard matrix layouts
    for (let id = 1; id <= TOTAL_CHANNELS; id++) {
      // 1. Render Box
      const box = document.createElement('div');
      box.className = 'green-box';
      box.id = `box-container-${id}`;
      box.innerHTML = `
        <span class="box-number">EXTERNAL ${id}</span>
        <span class="box-city" id="box-city-${id}"></span>
        <span class="box-liveu" id="box-liveu-${id}"></span>
      `;
      gridMain.appendChild(box);

      // 2. Render Control Row
      const wrapper = document.createElement('div');
      wrapper.className = 'input-wrapper';

      const idxSpan = document.createElement('span');
      idxSpan.className = 'input-idx';
      idxSpan.textContent = id;

      const selectsGroup = document.createElement('div');
      selectsGroup.className = 'selects-group';

      // City Select
      const citySelect = document.createElement('select');
      citySelect.className = 'yellow-select';

      kurdistanCities.forEach(city => {
        const option = document.createElement('option');
        option.value = city.startsWith('--') ? '' : city;
        option.textContent = city;
        citySelect.appendChild(option);
      });

      // LiveU Select
      const liveuSelect = document.createElement('select');
      liveuSelect.className = 'cyan-select';

      liveUOptions.forEach(lu => {
        const option = document.createElement('option');
        option.value = lu.startsWith('--') ? '' : lu;
        option.textContent = lu;
        liveuSelect.appendChild(option);
      });

      // Event: City Change
      citySelect.addEventListener('change', (e) => {
        const selectedCity = e.target.value;
        const boxCity = document.getElementById(`box-city-${id}`);
        const boxLiveu = document.getElementById(`box-liveu-${id}`);
        const boxContainer = document.getElementById(`box-container-${id}`);

        if (selectedCity) {
          boxCity.textContent = selectedCity;
          liveuSelect.style.display = 'block';
        } else {
          boxCity.textContent = '';
          boxLiveu.textContent = '';
          liveuSelect.value = '';
          liveuSelect.style.display = 'none';
        }

        triggerAlarm(boxContainer);
      });

      // Event: LiveU Change
      liveuSelect.addEventListener('change', (e) => {
        const selectedLiveU = e.target.value;
        const boxLiveu = document.getElementById(`box-liveu-${id}`);
        const boxContainer = document.getElementById(`box-container-${id}`);

        boxLiveu.textContent = selectedLiveU;
        triggerAlarm(boxContainer);
      });

      selectsGroup.appendChild(citySelect);
      selectsGroup.appendChild(liveuSelect);

      wrapper.appendChild(idxSpan);
      wrapper.appendChild(selectsGroup);
      controlsMain.appendChild(wrapper);
    }
  </script>

</body>
</html>
