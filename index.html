<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>External MCR Grid Monitor By Nwezhyan</title>
  <style>
    :root {
      --bg-main: #07090e;
      --card-bg: rgba(18, 22, 33, 0.85);
      --card-border: #1e2638;
      --accent-red: #ff2a55;
      --accent-cyan: #00e5ff;
      --accent-yellow: #ffcc00;
      --text-main: #f0f4f8;
      --text-muted: #62728d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100vh;
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 42, 85, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 50% 100%, rgba(0, 229, 255, 0.05) 0%, transparent 50%);
      overflow: hidden;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
    }

    /* Header Bar */
    .header-bar {
      width: 100%;
      padding: 14px 24px;
      background: rgba(15, 18, 28, 0.9);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(10px);
      flex-shrink: 0;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--text-main);
      text-transform: uppercase;
    }

    .live-dot {
      width: 12px;
      height: 12px;
      background-color: var(--accent-red);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-red);
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Main Fullscreen Container */
    .website-container {
      width: 100%;
      flex: 1;
      padding: 16px;
      box-sizing: border-box;
      display: flex;
      height: calc(100vh - 55px);
    }

    .content-split {
      display: flex;
      gap: 16px;
      width: 100%;
      height: 100%;
    }

    /* Grid Layout Auto-Stretches Vertically */
    .grid-container {
      flex: 1;
      display: grid;
      grid-template-rows: repeat(3, 1fr);
      gap: 14px;
      height: 100%;
    }

    .grid-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      height: 100%;
    }

    /* FULL HEIGHT BROADCAST BOXES */
    .green-box {
      position: relative;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-top: 4px solid var(--accent-cyan);
      border-radius: 12px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 12px 12px 12px;
      text-align: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .box-number {
      position: absolute;
      top: 10px;
      right: 14px;
      color: var(--accent-cyan);
      font-size: 14px;
      font-weight: 800;
      opacity: 0.85;
      letter-spacing: 0.8px;
    }

    .box-city {
      color: var(--text-main);
      font-size: 28px;
      font-weight: 800;
      line-height: 1.2;
    }

    .box-liveu {
      color: var(--accent-cyan);
      font-size: 20px;
      font-weight: 700;
      margin-top: 8px;
      letter-spacing: 0.5px;
    }

    /* ALARM ANIMATION */
    @keyframes broadcastAlarm {
      0% {
        background-color: rgba(255, 42, 85, 0.85);
        border-color: #ff2a55;
        box-shadow: 0 0 25px rgba(255, 42, 85, 0.9);
        transform: scale(1.01);
      }
      50% {
        background-color: rgba(255, 42, 85, 0.25);
        border-color: #ff7591;
        box-shadow: 0 0 8px rgba(255, 42, 85, 0.3);
        transform: scale(1);
      }
      100% {
        background-color: rgba(255, 42, 85, 0.85);
        border-color: #ff2a55;
        box-shadow: 0 0 25px rgba(255, 42, 85, 0.9);
        transform: scale(1.01);
      }
    }

    .green-box.alarm-active {
      animation: broadcastAlarm 0.7s infinite alternate;
      z-index: 10;
      border-top-color: #ffffff;
    }

    /* CONTROL PANEL STRETCHED */
    .input-panel {
      width: 220px;
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      gap: 10px;
      height: 100%;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(18, 22, 33, 0.6);
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      height: 100%;
    }

    .selects-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .cyan-select, .yellow-select {
      background: #0f131d;
      padding: 8px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 6px;
      outline: none;
      width: 100%;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .cyan-select {
      border: 1px solid rgba(0, 229, 255, 0.4);
      color: var(--accent-cyan);
    }

    .yellow-select {
      border: 1px solid rgba(255, 204, 0, 0.4);
      color: var(--accent-yellow);
      display: none;
    }

    .cyan-select:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
    }

    .yellow-select:focus {
      border-color: var(--accent-yellow);
      box-shadow: 0 0 8px rgba(255, 204, 0, 0.4);
    }

    .input-idx {
      color: var(--accent-cyan);
      font-size: 16px;
      font-weight: 800;
      min-width: 24px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="brand-title">
      <span class="live-dot"></span>
      <span>EXTERNAL MCR GRID MONITOR</span>
    </div>
  </div>

  <div class="website-container">
    <div class="content-split">
      <div class="grid-container" id="grid-main"></div>
      <div class="input-panel" id="controls-main"></div>
    </div>
  </div>

  <script>
    const TOTAL_CHANNELS = 6;

    const liveUOptions = [
      "-- سەرچاوە هەڵبژێرە --",
      "LiveU 1", "LiveU 2", "LiveU 3", "LiveU 4", "LiveU 5", "LiveU 6",
      "AFP", "APIN", "SUL Clean", "SUL PGM", "Anadolu AA",
      "UP 1", "UP 2", "UP 3", "UP 4",
      "ESync 1", "ESync 2", "ESync 3", "ESync 4",
      "XCON 1", "XCON 2",
      "GUEST 1", "GUEST 2", "GUEST Pro"
    ];

    const kurdistanCities = [
      "-- شار هەڵبژێرە --", "هەولێر", "سلێمانی", "دهۆک", "هەڵەبجە", "ڕانیە", 
      "قەڵادزێ", "کۆیە", "چەمچەماڵ", "کەرکووک", "زاخۆ", "ئاکرێ", "سۆران", 
      "کەلار", "کفری", "پێنجوێن", "دەربەندیخان", "شەقڵاوە", "شێخان", "ئامێدی", "بەردەڕەش"
    ];

    const alarmTimers = {};
    const gridMain = document.getElementById('grid-main');
    const controlsMain = document.getElementById('controls-main');

    function triggerAlarm(boxContainer) {
      if (!boxContainer) return;
      const boxId = boxContainer.id;
      boxContainer.classList.add('alarm-active');
      if (alarmTimers[boxId]) clearTimeout(alarmTimers[boxId]);
      alarmTimers[boxId] = setTimeout(() => {
        boxContainer.classList.remove('alarm-active');
      }, 5000);
    }

    // Explicit grid layout definition matching your layout request in RTL mode
    const layoutMap = [
      [2, 1], // Row 1: Ext 2 (Right), Ext 1 (Left)
      [4, 3], // Row 2: Ext 4 (Right), Ext 3 (Left)
      [6, 5]  // Row 3: Ext 6 (Right), Ext 5 (Left)
    ];

    // Build Grid Boxes according to layout matrix
    layoutMap.forEach(rowIds => {
      const row = document.createElement('div');
      row.className = 'grid-row';

      rowIds.forEach(id => {
        const box = document.createElement('div');
        box.className = 'green-box';
        box.id = `box-container-${id}`;
        box.innerHTML = `
          <span class="box-number">EXTERNAL ${id}</span>
          <span class="box-city" id="box-city-${id}"></span>
          <span class="box-liveu" id="box-liveu-${id}"></span>
        `;
        row.appendChild(box);
      });

      gridMain.appendChild(row);
    });

    // Build Control Panel Items (1 to 6)
    for (let id = 1; id <= TOTAL_CHANNELS; id++) {
      const wrapper = document.createElement('div');
      wrapper.className = 'input-wrapper';

      const idxSpan = document.createElement('span');
      idxSpan.className = 'input-idx';
      idxSpan.textContent = id;

      const selectsGroup = document.createElement('div');
      selectsGroup.className = 'selects-group';

      const liveuSelect = document.createElement('select');
      liveuSelect.className = 'cyan-select';
      liveUOptions.forEach(lu => {
        const option = document.createElement('option');
        option.value = lu.startsWith('--') ? '' : lu;
        option.textContent = lu;
        liveuSelect.appendChild(option);
      });

      const citySelect = document.createElement('select');
      citySelect.className = 'yellow-select';
      kurdistanCities.forEach(city => {
        const option = document.createElement('option');
        option.value = city.startsWith('--') ? '' : city;
        option.textContent = city;
        citySelect.appendChild(option);
      });

      liveuSelect.addEventListener('change', (e) => {
        const selectedLiveU = e.target.value;
        const boxLiveu = document.getElementById(`box-liveu-${id}`);
        const boxCity = document.getElementById(`box-city-${id}`);
        const boxContainer = document.getElementById(`box-container-${id}`);

        if (selectedLiveU) {
          boxLiveu.textContent = selectedLiveU;
          citySelect.style.display = 'block';
        } else {
          boxLiveu.textContent = '';
          boxCity.textContent = '';
          citySelect.value = '';
          citySelect.style.display = 'none';
        }

        triggerAlarm(boxContainer);
      });

      citySelect.addEventListener('change', (e) => {
        const selectedCity = e.target.value;
        const boxCity = document.getElementById(`box-city-${id}`);
        const boxContainer = document.getElementById(`box-container-${id}`);

        boxCity.textContent = selectedCity;
        triggerAlarm(boxContainer);
      });

      selectsGroup.appendChild(liveuSelect);
      selectsGroup.appendChild(citySelect);

      wrapper.appendChild(idxSpan);
      wrapper.appendChild(selectsGroup);
      controlsMain.appendChild(wrapper);
    }
  </script>

</body>
</html>
